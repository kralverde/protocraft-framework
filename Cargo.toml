[package]
name = "protocraft_framework"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A framework for handling minecraft packets"
# TODO: Readme, repository
license = "MIT OR Apache-2.0"
categories = ["no-std", "minecraft", "async", "protocol"]

[features]
v1_21_10 = []

std = [] # std
defaults = ["std", "cfb8", "aes", "flate2"] # std
async = []
tokio-io = ["tokio", "async"] # std
tokio-defaults = [
  "tokio-io",
  "cfb8",
  "aes",
  "async-compression",
  "async-compression/tokio",
  "async-compression/zlib",
] # std
futures-io = ["dep:futures-io", "futures-util", "async"] # std
futures-defaults = [
  "futures-io",
  "cfb8",
  "aes",
  "async-compression",
  "async-compression/futures-io",
  "async-compression/zlib",
] # std

[dependencies]
tokio = { version = "1.48.0", optional = true, default-features = false, features = [
  "io-util",
] }
futures-io = { version = "0.3.31", optional = true, default-features = false, features = [
  "std",
] }
futures-util = { version = "0.3.31", optional = true, default-features = false, features = [
  "std",
  "io",
  "sink",
] }
cfb8 = { version = "0.8.1", optional = true, default-features = false }
aes = { version = "0.8.4", optional = true, default-features = false }
flate2 = { version = "1.1.5", optional = true, default-features = false, features = [
  "rust_backend",
] }
async-compression = { version = "0.4.36", optional = true, default-features = false }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full"] }
futures = "0.3.31"
futures-net = "0.6.0"
example_helpers = { path = "./example_helpers" }

[[example]]
name = "server_status_sync"
required-features = ["defaults"]

[[example]]
name = "server_status_tokio_async"
required-features = ["tokio-defaults", "example_helpers/async"]

[[example]]
name = "server_status_futures_async"
required-features = ["futures-defaults", "example_helpers/async"]
