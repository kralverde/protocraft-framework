[package]
name = "protocraft_framework"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A framework for handling minecraft packets"
repository = "https://github.com/kralverde/protocraft-framework"
license = "MIT OR Apache-2.0"
categories = [
  "no-std",
  "parsing",
  "asynchronous",
  "game-development",
  "network-programming",
]

[features]
# Minecraft Versions
v1_21_10 = []
v1_21_9 = []
v1_21_8 = []
v1_21_7 = []
v1_21_6 = []
v1_21_5 = []
v1_21_4 = []
v1_21_1 = []
v1_21_0 = []
v1_20_6 = []
v1_20_5 = []
v1_20_4 = []
v1_20_3 = []
v1_20_2 = []
v1_20_1 = []
v1_20_0 = []
v1_19_4 = []
v1_19_3 = []
v1_19_2 = []
v1_19_1 = []
v1_19_0 = []
v1_18_2 = []
v1_18_1 = []
v1_18_0 = []
v1_17_1 = []
v1_17_0 = []
v1_16_5 = []
v1_16_4 = []
v1_16_3 = []
v1_15_2 = []
v1_14_4 = []
v1_13_2 = []
v1_13_1 = []
v1_12_2 = []
v1_12_1 = []
v1_12_0 = []
v1_11_2 = []
v1_11_1 = []
v1_11_0 = []
v1_10_2 = []
v1_10_1 = []
v1_10_0 = []
v1_9_4 = []
v1_9_3 = []
v1_9_2 = []
v1_9_1 = []
v1_9_0 = []
v1_8_9 = []
v1_8_8 = []
v1_8_7 = []
